# نمونه اصلاح‌شده برای فایل گیت‌هاب اکشن شما
name: Deploy Construction Suite

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # استفاده از آخرین نسخه پایدار نود جی‌اس

      - name: Install Frontend Dependencies
        run: npm install

      - name: Build Frontend (Vite)
        run: npx vite build # تولید فایل‌های استاتیک فرانت‌اند در پوشه dist برای کلودفلر

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "latest"